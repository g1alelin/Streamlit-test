<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Streamlit i Webbläsaren</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.71.0/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.71.0/build/stlite.js"></script>
    <script>
      stlite.mount({
        requirements: [],
        entrypoint: "app.py",
        files: {
          "app.py": `import streamlit as st

st.title("Streamlit är igång! 🚀")
st.write("Om du ser detta så fungerar din HTML-lösning perfekt.")

# Enkel test-funktion
namn = st.text_input("Skriv ditt namn här för att testa:")
if namn:
    st.success(f"Snyggt jobbat {namn}! Appen fungerar.")
`
        }
      }, document.getElementById("root"));
    </script>
  </body>
</html>
