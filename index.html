<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Streamlit i Webbläsaren</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.71.0/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.71.0/build/stlite.js"></script>
    <script>
          stlite.mount({
            requirements: ["pandas", "plotly", "geopandas", "folium", "streamlit-folium"], 
            entrypoint: "app.py",
            files: {
              // 1. Hämta din Python-kod
              "app.py": {
                url: "app.py"
              },
              // 2. Hämta din CSV-data
              "df_närvaro(Sheet 1).csv": {
                url: "df_närvaro(Sheet 1).csv"
              },
              // 3. Hämta din zippade shapefil för kartan
              "Stadsområde_shp.zip": {
                url: "Stadsområde_shp.zip"
              },
              // 4. Hämta din tomma användarfil
              "users.json": {
                url: "users.json"
              }
            }
          }, document.getElementById("root"));
    </script>
  </body>
</html>
