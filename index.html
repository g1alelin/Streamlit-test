<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Min Streamlit App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.71.0/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.71.0/build/stlite.js"></script>
    <script>
      stlite.mount({
        requirements: [], // Lägg till extra paket här om du använder t.ex. pandas eller plotly, t.ex. ["pandas"]
        entrypoint: "app.py",
        files: {
          "app.py": `
import streamlit as st

st.title("Hej Grundskoleförvaltningen!")
st.write("Det här är en test-app som körs säkert via GitHub Pages.")

# Lägg till din egen Streamlit-kod här under:
namn = st.text_input("Vad heter du?")
if namn:
    st.write(f"Välkommen att testa appen, {namn}!")
`,
        },
      }, document.getElementById("root"));
    </script>
  </body>
</html>
